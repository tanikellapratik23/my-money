<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Money · Your money, in one place</title><style>
:root{--bg:#f5f6f2;--ink:#20382d;--muted:#7b857e;--line:#e4e8df;--green:#d9edb8;--dark:#253d31}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #90af66;outline-offset:3px}aside{position:fixed;width:220px;inset:0 auto 0 0;background:#fff;border-right:1px solid var(--line);padding:34px 22px;display:flex;flex-direction:column}.logo{font-size:23px;font-weight:750;letter-spacing:-1px}.logo span{background:var(--dark);color:var(--green);padding:4px 9px;border-radius:10px;margin-right:8px}.tiny{font-size:11px;text-transform:uppercase;letter-spacing:1.6px;color:var(--muted);font-weight:650}nav{margin-top:52px;display:grid;gap:8px}nav button{border:0;background:transparent;text-align:left;color:#748078;padding:14px;border-radius:9px}nav button.active{background:#eef3e7;color:var(--ink);font-weight:650}.bottom{margin-top:auto;font-size:12px;line-height:1.7;color:var(--muted)}main{max-width:1480px;margin-left:220px;padding:32px 42px 60px}.top{display:flex;justify-content:space-between;align-items:center;padding-bottom:25px;border-bottom:1px solid var(--line)}.pill{border:1px solid var(--line);background:#fff;border-radius:24px;padding:9px 15px;font-size:12px}.intro{display:flex;align-items:center;justify-content:space-between;margin:34px 0 26px}h1{font-size:34px;letter-spacing:-1.3px;margin:8px 0 10px;font-weight:600}p{color:var(--muted);line-height:1.6;margin:6px 0}h2{font-size:18px;letter-spacing:-.4px;margin:0}.btn{border:0;border-radius:8px;padding:12px 17px;background:var(--dark);color:white}.secondary{background:white;color:var(--ink);border:1px solid var(--line)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card,.panel{border:1px solid var(--line);border-radius:14px;background:#fff;padding:23px}.card.feature{background:var(--dark);color:white;border:0}.card .label{font-size:12px;color:var(--muted)}.feature .label,.feature p{color:#c5d2c5}.value{font-size:30px;letter-spacing:-1px;margin:16px 0 9px;font-weight:550}.card p{font-size:11px}.grid{display:grid;grid-template-columns:1.55fr 1fr;gap:22px;margin-top:23px}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.link{background:none;border:0;color:#647a53;font-size:12px;padding:4px}.flow{display:flex;height:13px;border-radius:9px;overflow:hidden;background:#eff2e9;margin:25px 0}.flow span{min-width:0}.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid #f0f1ec}.row:first-child{border-top:0}.ico{width:36px;height:36px;display:grid;place-items:center;background:#f0f3e9;border-radius:10px;font-size:17px}.grow{flex:1;min-width:0}.row strong{font-weight:550}.sub{font-size:11px;color:var(--muted);margin-top:4px}.amount{font-variant-numeric:tabular-nums}.smallbtn{border:0;background:#f5f7f1;border-radius:6px;padding:7px 9px;color:#6d7d66}.empty{padding:24px 5px;color:var(--muted);line-height:1.7;font-size:13px}.badge{font-size:10px;background:#f1f5e9;color:#6d8651;border-radius:5px;padding:5px 7px}.bar{background:#edf0e7;height:6px;border-radius:5px;margin-top:13px;overflow:hidden}.bar i{display:block;background:#9cb977;height:100%;border-radius:5px}.foot{margin-top:24px;font-size:11px;color:var(--muted)}.section{display:none}.section.visible{display:block}.wide{margin-top:24px}.actions{display:flex;gap:8px;align-items:center}dialog{width:440px;border:1px solid var(--line);border-radius:18px;padding:28px;color:var(--ink);max-width:94vw}dialog::backdrop{background:#18291f66;backdrop-filter:blur(3px)}label{display:block;font-size:12px;margin:17px 0 6px}input,select{width:100%;padding:11px;border:1px solid #dce2d5;border-radius:7px;background:white;color:var(--ink)}.modalfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}.negative{color:#b46746}.notice{padding:14px 18px;background:#edf3e4;border-radius:9px;color:#60734c;margin:18px 0;font-size:12px}.statline{display:flex;justify-content:space-between;font-size:12px;margin:16px 0}.credit{background:#edf1e6;border:0}.credit .value{font-size:32px}.credit button{margin-top:16px}.profile{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:20px;margin-top:25px}.avatar{background:#e8eddf;border-radius:50%;width:33px;height:33px;display:grid;place-items:center;color:#5a6e48}.mobilelogo{display:none}@media(max-width:1100px){aside{width:185px}main{margin-left:185px;padding:25px}.cards{gap:10px}.card{padding:17px}.value{font-size:25px}.grid{grid-template-columns:1.2fr 1fr}}@media(max-width:760px){aside{position:static;width:auto;padding:20px;display:block}aside .bottom{display:none}nav{margin-top:18px;display:flex;overflow:auto;gap:4px}nav button{white-space:nowrap;padding:10px}main{margin:0;padding:20px}.top{padding-bottom:18px}.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.intro{align-items:flex-start;gap:12px}h1{font-size:28px}.intro .btn{font-size:12px;white-space:nowrap}.pill{font-size:10px}.card{padding:18px}.value{font-size:26px}}
</style></head><body><aside><div class="logo"><span>m</span> my money<span style="background:none;color:#99b77b;padding:0">.</span></div><nav id="nav"></nav><div class="bottom">A little clarity.<br>A lot more peace of mind.<div class="profile"><div class="avatar">P</div><div>Your personal space<br><b style="color:#40543a">Just for you</b></div></div></div></aside><main><div class="top"><span class="tiny">YOUR MONEY, IN ONE PLACE</span><div class="actions"><span class="pill" id="today"></span><button class="pill" onclick="settings()">Backup & settings</button></div></div><div class="intro"><div><div class="tiny" id="month"></div><h1 id="heading">A clear view of your money.</h1><p id="subtitle">Make room for today. Build toward tomorrow.</p></div><button class="btn" onclick="openForm('expense')">＋ Add expense</button></div><div id="content"></div><div class="foot">● Saved on this device · Manual tracking · Balances stay until you change them</div></main><dialog id="modal"><form id="form"><h2 id="modalTitle"></h2><div id="fields"></div><div class="modalfoot"><button type="button" class="btn secondary" onclick="modal.close()">Cancel</button><button class="btn" type="submit">Save changes</button></div></form></dialog><script>
const KEY='my-money-v1', now=()=>new Date(), monthKey=()=>`${now().getFullYear()}-${String(now().getMonth()+1).padStart(2,'0')}`;let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{}db=db&&db.months?db:{months:{},cards:[],goals:[],subscriptions:[],name:''};let view='Overview',editing=null;const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(n||0),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),sum=a=>a.reduce((s,x)=>s+Number(x.amount||0),0);function month(){let k=monthKey();if(!db.months[k])db.months[k]={income:[],expense:[],allocation:[]};return db.months[k]}function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('Storage is full or unavailable. Export a backup to keep your entries.')}render()}
const cats=['Rent & housing','Groceries','Food & dining','Transportation','Utilities','Shopping','Health','Entertainment','Other'];const dests=['Savings','Emergency fund','Roth IRA','Brokerage','Other investment'];const colors=['#728b5c','#c4d6ac','#dcb991','#b7c9c5','#cad1bc'];function monthlySubs(){return db.subscriptions.reduce((s,x)=>s+x.amount/(x.cycle==='Yearly'?12:1),0)}function totals(){let m=month();return {income:sum(m.income),spent:sum(m.expense),allocated:sum(m.allocation),subs:monthlySubs()}}function stats(){let t=totals(),left=t.income-t.spent-t.allocated-t.subs;return `<div class="cards"><div class="card feature"><div class="label">Available to assign ↗</div><div class="value">${money(left)}</div><p>${left<0?'Your plan is over your income.':'Income minus spending, allocations & subscriptions'}</p></div><div class="card"><div class="label">↙ &nbsp; Monthly income</div><div class="value">${money(t.income)}</div><p><button class="link" onclick="openForm('income')">Add income →</button></p></div><div class="card"><div class="label">↗ &nbsp; Spending so far</div><div class="value">${money(t.spent+t.subs)}</div><p>Expenses + monthly subscription equivalent</p></div><div class="card"><div class="label">◈ &nbsp; Saving & investing</div><div class="value">${money(t.allocated)}</div><p>Money set aside this month</p></div></div>`}function head(title,action,type){return `<div class="panelhead"><h2>${title}</h2><button class="link" onclick="openForm('${type}')">＋ ${action}</button></div>`}function rows(arr,type,icon){return arr.length?arr.map(x=>`<div class="row"><div class="ico">${icon}</div><div class="grow"><strong>${esc(x.name)}</strong><div class="sub">${esc(x.category||x.date||'')}${x.cycle?' · '+esc(x.cycle):''}</div></div><span class="amount">${money(x.amount)}</span><button class="smallbtn" aria-label="Edit ${esc(x.name)}" onclick="openForm('${type}','${x.id}')">✎</button></div>`).join(''):`<div class="empty">Nothing here yet. Add your first ${type==='allocation'?'savings or investment allocation':type==='subscription'?'subscription':type} to get started.</div>`}function spending(){let m=month(),t=totals(),total=t.spent+t.allocated+t.subs;let groups=[['Everyday spending',t.spent],['Saving & investing',t.allocated],['Subscriptions',t.subs]];return `<div class="panel">${head('Where your money goes','Add expense','expense')}<p style="font-size:12px">Every dollar, with a little more intention.</p><div class="flow">${groups.map((g,i)=>`<span style="width:${total?g[1]/total*100:0}%;background:${colors[i]}"></span>`).join('')}</div>${groups.map((g,i)=>`<div class="row"><span style="width:9px;height:9px;border-radius:50%;background:${colors[i]}"></span><div class="grow">${g[0]}</div><strong>${money(g[1])}</strong></div>`).join('')}<div class="statline"><span>Total assigned</span><b>${money(total)}</b></div><p style="font-size:11px">Credit card balances are tracked separately to avoid counting the same purchase twice.</p></div>`}function cards(){return `<div class="panel credit">${head('Credit cards','Add card','card')}${db.cards.length?db.cards.map(x=>`<div class="row"><div class="grow"><div class="tiny">${esc(x.name)}</div><div class="value">${money(x.amount)}</div><div class="sub">Balance as of ${esc(x.date)}${x.due?' · Due '+esc(x.due):''}</div></div><button class="smallbtn" onclick="openForm('card','${x.id}')">Update</button></div>`).join(''):`<div class="value">${money(0)}</div><p>Add what you owe today. It stays here until you update it.</p><button class="btn secondary" onclick="openForm('card')">Add your credit card →</button>`}</div>`}function goals(){return `<div class="panel">${head('A future you’re building','Add goal','goal')}${db.goals.length?db.goals.map(x=>`<div class="row"><div class="grow"><strong>${esc(x.name)}</strong><div class="sub">${money(x.amount)} of ${money(x.target)} · ${x.target?Math.round(x.amount/x.target*100):0}%</div><div class="bar"><i style="width:${Math.min(100,x.target?x.amount/x.target*100:0)}%"></i></div></div><button class="smallbtn" onclick="openForm('goal','${x.id}')">Update</button></div>`).join(''):`<div class="empty">An emergency fund. Your next move. More freedom.<br>Give your money something to work toward.</div><button class="btn secondary" onclick="openForm('goal')">Set your first goal →</button>`}</div>`}function budgets(){let m=month();m.budgets=m.budgets||{};return `<div class="panel wide"><div class="panelhead"><h2>Your spending plan</h2><button class="link" onclick="editBudgets()">Edit monthly limits</button></div><p class="sub">Set limits by category and compare them with your logged expenses.</p>${cats.map(c=>{let actual=sum(m.expense.filter(x=>x.category===c)),limit=Number(m.budgets[c]||0);return `<div class="row"><div class="grow"><strong>${c}</strong><div class="bar"><i style="width:${limit?Math.min(100,actual/limit*100):0}%;background:${actual>limit&&limit?'#c78c6a':'#9cb977'}"></i></div></div><span class="amount ${limit&&actual>limit?'negative':''}">${money(actual)} / ${limit?money(limit):'No limit'}</span></div>`}).join('')}</div>`}function editBudgets(){let m=month();m.budgets=m.budgets||{};modalTitle.textContent='Your monthly spending limits';fields.innerHTML=cats.map((c,i)=>input('b'+i,c,m.budgets[c]||'','number','min="0" max="1000000000" step="0.01"')).join('');form.onsubmit=e=>{e.preventDefault();let d=new FormData(form);cats.forEach((c,i)=>m.budgets[c]=Number(d.get('b'+i)||0));save();modal.close()};modal.showModal()}function render(){let m=month();document.getElementById('month').textContent=now().toLocaleDateString('en-US',{month:'long',year:'numeric'})+' / YOUR MONTH';document.getElementById('today').textContent=now().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});document.getElementById('nav').innerHTML=['Overview','Income & expenses','Save & invest','Subscriptions','Goals','History'].map((s,i)=>`<button class="${view===s?'active':''}" onclick="view='${s}';render()">${['◫','↔','◈','↻','⚑','◷'][i]} &nbsp; ${s}</button>`).join('');document.getElementById('heading').textContent=view==='Overview'?(db.name?`${db.name}, let’s make money feel simple.`:'A clear view of your money.'):view;let h=stats();if(view==='Overview')h+=`<div class="grid">${spending()}${cards()}<div class="panel">${head('Saving & investing','Allocate','allocation')}${rows(m.allocation,'allocation','↗')}</div>${goals()}</div><div class="panel wide">${head('Your subscriptions','Add subscription','subscription')}${rows(db.subscriptions,'subscription','↻')}</div>`;if(view==='Income & expenses')h+=`<div class="grid"><div class="panel">${head('This month’s expenses','Add expense','expense')}<p class="sub">Log purchases here; recurring subscriptions have their own tab.</p>${rows(m.expense,'expense','↗')}</div><div><div class="panel">${head('Money coming in','Add income','income')}${rows(m.income,'income','↙')}</div><div style="margin-top:22px">${cards()}</div></div></div>`;if(view==='Save & invest')h+=`<div class="grid"><div class="panel">${head('Monthly allocations','Allocate','allocation')}<p class="sub">Record money set aside for savings, your emergency fund, Roth IRA, or brokerage.</p>${rows(m.allocation,'allocation','◈')}</div>${goals()}</div><div class="notice">Allocations track this month’s money. Goal progress is a separate balance you update manually.</div>`;if(view==='Subscriptions')h+=`<div class="panel wide">${head('The recurring things','Add subscription','subscription')}<p>Monthly equivalent: <b>${money(monthlySubs())}</b> · Annual equivalent: <b>${money(monthlySubs()*12)}</b></p><p class="sub">Subscriptions carry forward automatically. Don’t also log them as expenses. Yearly plans are spread over 12 months for planning.</p>${rows(db.subscriptions,'subscription','↻')}</div>`;if(view==='Goals')h+=`<div class="wide">${goals()}</div>`;if(view==='History')h+=`<div class="panel wide"><h2>Your monthly records</h2><p class="sub">Past entries stay saved as each new month begins. Historical totals below exclude recurring subscriptions.</p>${Object.keys(db.months).sort().reverse().map(k=>{let a=db.months[k];return `<div class="row"><strong class="grow">${esc(k)}</strong><span>In ${money(sum(a.income))} · Spent ${money(sum(a.expense))} · Set aside ${money(sum(a.allocation))}</span><button class="smallbtn" onclick="historyMonth('${k}')">View</button></div>`}).join('')}</div>`;if(view==='Income & expenses')h+=budgets();document.getElementById('content').innerHTML=h}function historyMonth(k){let m=db.months[k];modalTitle.textContent='Records · '+k;fields.innerHTML=['income','expense','allocation'].map(t=>`<h3>${t}</h3>${m[t].map(x=>`<div class="row"><span class="grow">${esc(x.name)}</span>${money(x.amount)}</div>`).join('')||'<p>No entries</p>'}`).join('');form.onsubmit=e=>{e.preventDefault();modal.close()};modal.showModal()}
function collection(type){return type==='card'?db.cards:type==='goal'?db.goals:type==='subscription'?db.subscriptions:month()[type]}function input(name,label,value='',type='text',extra=''){return `<label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}>`}function select(name,label,options,value){return `<label for="f-${name}">${label}</label><select id="f-${name}" name="${name}">${options.map(s=>`<option ${s===value?'selected':''}>${esc(s)}</option>`).join('')}</select>`}function openForm(type,id){let arr=collection(type),x=arr.find(x=>x.id===id)||{};modalTitle.textContent=(id?'Edit ':'Add ')+({income:'income',expense:'expense',allocation:'savings or investing',card:'credit card',goal:'money goal',subscription:'subscription'}[type]);let h=input('name',type==='card'?'Card name':'Name',x.name||'','text','required maxlength="80"');if(type==='expense')h+=select('category','Category',cats,x.category);if(type==='allocation')h+=select('category','Destination',dests,x.category);h+=input('amount',type==='card'?'Current balance owed ($)':type==='goal'?'Saved so far ($)':'Amount ($)',x.amount??'','number','required min="0" max="1000000000" step="0.01"');if(type==='goal')h+=input('target','Goal target ($)',x.target||'','number','required min="0.01" max="1000000000" step="0.01"');if(type==='subscription')h+=select('cycle','Billing cycle',['Monthly','Yearly'],x.cycle);h+=input('date',type==='card'?'Balance as of':type==='subscription'?'Next renewal date':'Date',x.date||`${now().getFullYear()}-${String(now().getMonth()+1).padStart(2,'0')}-${String(now().getDate()).padStart(2,'0')}`,'date','required');if(type==='card')h+=input('due','Payment due date (optional)',x.due||'','date');if(id)h+=`<button type="button" class="link negative" style="margin-top:18px" onclick="removeEntry('${type}','${id}')">Delete this entry</button>`;fields.innerHTML=h;form.onsubmit=e=>{e.preventDefault();let item=Object.fromEntries(new FormData(form));item.amount=Number(item.amount);if(item.target)item.target=Number(item.target);item.id=id||crypto.randomUUID();if(id)arr[arr.findIndex(x=>x.id===id)]=item;else arr.push(item);save();modal.close()};modal.showModal()}function removeEntry(t,id){if(confirm('Delete this entry?')){let a=collection(t);a.splice(a.findIndex(x=>x.id===id),1);save();modal.close()}}
function settings(){modalTitle.textContent='Your personal space';fields.innerHTML=input('name','Your first name',db.name,'text','maxlength="35"')+`<div class="notice">Your entries are stored in this browser on this device. Export a backup before switching devices or clearing browser data.</div><div class="actions"><button class="btn secondary" type="button" onclick="exportData()">Export backup</button><button class="btn secondary" type="button" onclick="document.getElementById('import').click()">Import backup</button></div><input id="import" type="file" accept="application/json" hidden onchange="importData(this)">`;form.onsubmit=e=>{e.preventDefault();db.name=new FormData(form).get('name').trim();save();modal.close()};modal.showModal()}function exportData(){const b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='my-money-backup-'+monthKey()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function importData(el){try{let v=JSON.parse(await el.files[0].text());if(!v.months||!Array.isArray(v.cards)||!Array.isArray(v.goals)||!Array.isArray(v.subscriptions))throw Error();for(const m of Object.values(v.months))for(const t of ['income','expense','allocation'])if(!Array.isArray(m[t]))throw Error();for(const a of [...Object.values(v.months).flatMap(m=>[...m.income,...m.expense,...m.allocation]),...v.cards,...v.goals,...v.subscriptions])if(typeof a.name!=='string'||!Number.isFinite(a.amount)||a.amount<0||typeof a.id!=='string')throw Error();if(confirm('Replace the data on this device with this backup?')){db=v;save();modal.close()}}catch{alert('This file is not a valid My Money backup.')}}render();setInterval(()=>render(),60000);
</script></body></html>
